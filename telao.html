<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Cronômetro - Câmara Municipal de Ubá
</title>

<link
rel="icon"
type="image/png"
href="Brasao_Uba.png">

<style>

:root{
    --brasao-opacity: 0.5;
}

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body{
    font-family: Arial, sans-serif;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: white;
    position: relative;
}

.brasao-fundo{
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-image: url('Brasao_Uba.png'), url('https://setorlegislativocamarauba.github.io/cronometro/Brasao_Uba.png');
    background-position: center center;
    background-repeat: no-repeat;
    background-size: contain;
    opacity: 0.5;
    z-index: 0;
    pointer-events: none;
    transition: opacity 0.05s linear;
}

.container-telao,
.relogio-telao{
    position: relative;
    z-index: 1;
}

.container-telao{
    text-align:center;
    width:100%;
    padding:10px 40px;
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
    position: relative;
}
.espacador-telao{
    flex:0 0 auto;
    height:40px;
}
.titulo-sessao-telao{
    font-size: clamp(30px, 4vw, 65px);
    line-height: 1.1;
    font-weight: bold;
    color: #fff;
    margin-top: 10px;
    text-decoration: underline;
    text-decoration-thickness: 1px;
    flex:0 0 auto;
    min-height:90px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.status-telao{
    font-size: 40px;
    font-weight: bold;
    color: #fff;
    margin-bottom: 0;
    flex:0 0 auto;
    height:55px;
}

.orador-atual-telao{
    font-size:clamp(40px,3vw,60px);
    font-weight:bold;
    color:#fff;
    text-transform:uppercase;
    line-height:1.2;
    min-height:80px;
    max-height:120px;
    margin-bottom: 0;
    text-align:center;
    overflow:hidden;
    flex:0 0 auto;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:0 20px;
}

.orador-atual-telao .replica-subtitle{
    display:block;
    font-weight:normal;
    color:#fff;
    margin-top:6px;
    font-size:clamp(24px,2vw,40px);
    line-height:1.1;
}

/* Cronômetro fixo - sempre na mesma posição */
.cronometro-telao{
    font-size: 180px;
    font-weight: bold;
    color: #fff;
    font-family: Arial, sans-serif;
    text-shadow:
    -1px -1px 0 #000,
     3px -1px 0 #000,
    -1px  1px 0 #000,
     1px  1px 0 #000;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    line-height: 1;
}

.proximo-orador-telao{
    font-size:30px;
    color:#fff;
    margin-top:auto;
    margin-bottom:20px;
    max-width: calc(100% - 250px);
    margin-left:auto;
    margin-right:auto;
    text-align:center;
    flex:0 0 auto;
    min-height:50px;
    line-height:1.3;
    word-wrap:break-word;
    overflow-wrap:break-word;
    padding:5px 0;
}

.relogio-telao{
    position: fixed;
    bottom: 15px;
    right: 15px;
    font-size: 30px;
    color: #fff;
    text-align: right;
    line-height: 1.4;
    z-index: 999;
}

@keyframes piscarFinal {
    0% {
        opacity: 1;
    }
    50% {
        opacity: 0.2;
    }
    100% {
        opacity: 1;
    }
}

.cronometroPiscando{
    animation: piscarFinal 1s infinite;
}

        /* Responsive adjustments for smaller screens */
        @media (max-height: 850px) {
            .container-telao { padding: 10px 20px; }
            .espacador-telao { height: 20px; }
            .titulo-sessao-telao { min-height: 60px; font-size: clamp(24px, 3.5vw, 45px); margin-top: 5px; }
            .status-telao { font-size: 28px; height: 40px; }
            .orador-atual-telao { font-size: clamp(30px, 2.5vw, 45px); min-height: 60px; }
            .cronometro-telao { font-size: 130px; }
            .proximo-orador-telao { font-size: 22px; margin-bottom: 10px; min-height: 30px; }
            .relogio-telao { font-size: 22px; bottom: 10px; right: 10px; }
        }
        @media (max-height: 700px) {
            .container-telao { padding: 5px 15px; }
            .espacador-telao { height: 10px; }
            .titulo-sessao-telao { min-height: 40px; font-size: clamp(20px, 3vw, 35px); }
            .status-telao { font-size: 22px; height: 30px; }
            .orador-atual-telao { font-size: clamp(24px, 2vw, 35px); min-height: 40px; }
            .cronometro-telao { font-size: 100px; }
            .proximo-orador-telao { font-size: 18px; margin-bottom: 5px; min-height: 25px; }
            .relogio-telao { font-size: 18px; }
        }
    </style>



</head>

<body>

<div id="brasaoFundo" class="brasao-fundo"></div>

<div class="relogio-telao" id="relogioTelao"></div>

<div class="container-telao">

    <div class="titulo-sessao-telao" id="tituloSessaoTelao">
        CONSIDERAÇÕES FINAIS
    </div>
	<div class="espacador-telao"></div>

    <div id="conteudoNormalTelao" style="flex:1;display:flex;flex-direction:column;position:relative;">

        <div class="status-telao" id="statusTelao">
            USANDO A PALAVRA:
        </div>

        <div class="orador-atual-telao" id="oradorAtualTelao">
            AGUARDANDO INÍCIO
        </div>

        <div class="cronometro-telao" id="cronometroTelao">
            
        </div>

        <div class="proximo-orador-telao" id="proximoOradorTelao">
            Próximo Orador: ---
        </div>

    </div>

    <!-- Conteúdo da Tela Simples (inicialmente oculto) -->
    <div id="conteudoSimplesTelao" style="display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;">

        <div style="font-size:120px;font-weight:bold;color:#fff;margin-bottom:60px;">
            Câmara Municipal de Ubá/MG
        </div>

    </div>

</div>

<script>

// Sincronizar com a aba principal usando localStorage e BroadcastChannel
function aplicarOpacidadeBrasao(opacidade) {
    const brasaoEl = document.getElementById('brasaoFundo');
    if(brasaoEl){
        brasaoEl.style.opacity = opacidade;
    }
    document.documentElement.style.setProperty('--brasao-opacity', opacidade);
    document.body.style.setProperty('--brasao-opacity', opacidade);
}

function atualizarTelao(dadosParam) {
    try{
        const dados = dadosParam || JSON.parse(localStorage.getItem('estadoCronometro') || '{}');
        const modo = dados.modoSessao || 'consideracoes';

        // Quando estiver na aba de administrador no operador, NÃO exibir nem alterar para "ADMINISTRADOR" no telão!
        if (modo === 'administrador' || (dados.tituloSessao && dados.tituloSessao.trim().toUpperCase() === 'ADMINISTRADOR')) {
            return;
        }

        const opacidadeRaw = (dados && dados.opacidadeBrasao !== undefined) ? dados.opacidadeBrasao : localStorage.getItem('opacidadeBrasao');
        const opacidade = (opacidadeRaw !== null && opacidadeRaw !== '' && !isNaN(parseFloat(opacidadeRaw))) ? opacidadeRaw : '0.5';
        aplicarOpacidadeBrasao(opacidade);
        
        document.getElementById('tituloSessaoTelao').textContent = dados.tituloSessao || 'CONSIDERAÇÕES FINAIS';
        
        // Mostrar/esconder conteúdo da Tela Simples
        const normalContent = document.getElementById('conteudoNormalTelao');
        const simpleContent = document.getElementById('conteudoSimplesTelao');
        const bodyEl = document.body;
        
        if(modo === 'tela_simples'){
            normalContent.style.display = 'none';
            simpleContent.style.display = 'flex';
            bodyEl.classList.add('tela-simples-mode');
            document.getElementById('tituloSessaoTelao').style.display = 'none';
        } else {
            normalContent.style.display = 'flex';
            simpleContent.style.display = 'none';
            bodyEl.classList.remove('tela-simples-mode');
            document.getElementById('tituloSessaoTelao').style.display = '';
        }
        
        const isModoSimples = dados.modoSessao === 'condolencias' || dados.modoSessao === 'pausa';
        
        // Para Condolências e Pausa, esconder "USANDO A PALAVRA" e "AGUARDANDO INÍCIO"
        const statusEl = document.getElementById('statusTelao');
        const oradorAtualEl = document.getElementById('oradorAtualTelao');
        
        if(isModoSimples){
            statusEl.style.display = 'none';
            oradorAtualEl.style.display = 'none';
        } else {
            statusEl.style.display = '';
            oradorAtualEl.style.display = '';
            const oradorTexto = dados.oradorAtual || 'AGUARDANDO INÍCIO';
            const replicaMatch = oradorTexto.match(/^(.+)\s*\(RÉPLICA DE\s*(.+)\)$/i);
            if(replicaMatch){
                oradorAtualEl.innerHTML = replicaMatch[1] + '<span class="replica-subtitle">RÉPLICA DE ' + replicaMatch[2] + '</span>';
            } else {
                oradorAtualEl.textContent = oradorTexto;
            }
        }
        
        const corOrador = (dados && dados.corNomeOrador) || localStorage.getItem('corNomeOrador') || '#fff';
        oradorAtualEl.style.color = corOrador;

        const cronEl = document.getElementById('cronometroTelao');
        // Se o cronômetro estiver oculto no operador, ocultar também no telão
        if(dados.cronometroOculto){
            cronEl.style.display = 'none';
        } else {
            cronEl.style.display = '';
            cronEl.textContent = dados.cronometro || '05:00';
            const partes = cronEl.textContent.split(':');
            const segundos = parseInt(partes[0]) * 60 + parseInt(partes[1]);

            if(segundos <= 10 && segundos > 0){
                cronEl.classList.add('cronometroPiscando');
            }else{
                cronEl.classList.remove('cronometroPiscando');
            }
            
            const baseTimerColor = (dados && dados.corCronometro) || localStorage.getItem('corCronometro') || '#fff';
            cronEl.style.color = dados.cronometroCor || baseTimerColor;
        }
        
        const proximoEl = document.getElementById('proximoOradorTelao');
        if(dados.modoSessao === 'consideracoes'){
            proximoEl.style.display = '';
            proximoEl.textContent = dados.proximoOrador || 'Próximo Orador: ---';
        } else {
            proximoEl.style.display = 'none';
        }
        
    } catch(e){
        console.log('Erro ao sincronizar:', e);
    }
}

let ultimoTimestampServidor = 0;
async function buscarEstadoServidor() {
    try {
        const resp = await fetch('/api/estado-telao');
        if (resp.ok) {
            const dadosServidor = await resp.json();
            if (dadosServidor && dadosServidor.timestamp && dadosServidor.timestamp > ultimoTimestampServidor) {
                ultimoTimestampServidor = dadosServidor.timestamp;
                atualizarTelao(dadosServidor);
            }
        }
    } catch(e) {}
}

// Inicia na primeira carga
atualizarTelao();
buscarEstadoServidor();

// Sincronização em tempo real via BroadcastChannel
const canalTelao = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('canal_telao') : null;
if(canalTelao){
    canalTelao.onmessage = function(ev){
        if(ev && ev.data){
            if(ev.data.tipo === 'opacidadeBrasao'){
                aplicarOpacidadeBrasao(ev.data.valor);
            } else if(ev.data.tipo === 'corNomeOrador'){
                const oradorAtualEl = document.getElementById('oradorAtualTelao');
                if(oradorAtualEl) oradorAtualEl.style.color = ev.data.valor;
            } else if(ev.data.tipo === 'corCronometro'){
                const cronEl = document.getElementById('cronometroTelao');
                if(cronEl) cronEl.style.color = ev.data.valor;
            } else if(ev.data.tipo === 'estado' && ev.data.dados){
                atualizarTelao(ev.data.dados);
            } else {
                atualizarTelao();
            }
        }
    };
}

// Atualiza instantaneamente sempre que houver mudanças de storage entre abas do mesmo domínio
window.addEventListener('storage', () => atualizarTelao());

// Polling contínuo com o servidor para sincronização independente de navegador/partição
setInterval(buscarEstadoServidor, 250);

function atualizarRelogio(){
    const agora = new Date();
    const hh = String(agora.getHours()).padStart(2,'0');
    const mm = String(agora.getMinutes()).padStart(2,'0');
    const ss = String(agora.getSeconds()).padStart(2,'0');
    const dd = String(agora.getDate()).padStart(2,'0');
    const mo = String(agora.getMonth()+1).padStart(2,'0');
    const yy = String(agora.getFullYear()).slice(-2);
    document.getElementById('relogioTelao').innerHTML = hh+':'+mm+':'+ss+'<br>'+dd+'/'+mo+'/'+yy;
}
atualizarRelogio();
setInterval(atualizarRelogio, 1000);

</script>

</body>

</html>
