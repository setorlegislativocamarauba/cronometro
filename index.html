<!DOCTYPE html>
<html lang="pt-BR">

<head>


<meta charset="UTF-8">

<!--
Sistema desenvolvido por Diones Ferreira de Almeida, servidor da Câmara Municipal de Ubá/MG.

Este projeto foi concebido com o objetivo de modernizar e padronizar o controle de tempo utilizado durante as sessões plenárias, proporcionando maior eficiência, confiabilidade e profissionalismo aos trabalhos legislativos.

O desenvolvimento foi realizado utilizando o Visual Studio Code, com suporte de ferramentas de inteligência artificial aplicadas ao processo de programação.

A utilização, adaptação e distribuição deste sistema são permitidas para câmaras municipais e demais órgãos públicos interessados. É vedada sua comercialização, total ou parcial.
-->


<meta
name="viewport"
content="width=device-width, initial-scale=1.0">
<meta name="description" content="Sistema de controle de tempo e telão para sessões plenárias da Câmara Municipal de Ubá com integração SAPL">

<title>
Controle de Uso da Palavra
</title>

<link
rel="icon"
type="image/png"
href="Brasao_Uba.png">

<link
rel="stylesheet"
href="controle.css">

</head>

<body>


<!-- MODOS -->

<div class="modosSessao">

    <button id="modoAdministrador">
        <img class="iconeBotao" src="icons/administrador.svg" alt="">
        Administrador
    </button>

    <button id="modoTelaSimples">
        <img class="iconeBotao" src="icons/tela-simples.svg" alt="">
        Telão
    </button>

    <button id="modoDiscussao">
        <img class="iconeBotao" src="icons/discussao.svg" alt="">
        Discussão de Proposições
    </button>

    <button id="modoConsideracoes">
        <img class="iconeBotao" src="icons/consideracoes.svg" alt="">
        Considerações Finais
    </button>

    <button id="modoTribuna">
        <img class="iconeBotao" src="icons/tribuna.svg" alt="">
        Tribuna Livre
    </button>

    <button id="modoConvidados">
        <img class="iconeBotao" src="icons/convidados.svg" alt="">
        Convidados
    </button>

    <button id="modoAudiencia">
        <img class="iconeBotao" src="icons/convidados.svg" alt="">
        Audiência / Seminário
    </button>

    <button id="modoPausa">
        <img class="iconeBotao" src="icons/pausa.svg" alt="">
        Pausa da Sessão
    </button>

    <button id="modoCondolencias">
        <img class="iconeBotao" src="icons/condolencias.svg" alt="">
        Condolências
    </button>

</div>

<div id="tituloSessao">
    CONSIDERAÇÕES FINAIS
</div>

<!-- CONTAINER PRINCIPAL -->

<div class="container">

    <!-- COLUNA 1 -->

    <div
    class="coluna colunaEsquerda">

        <div
        class="painel"
        id="painelEsquerdo">

        </div>

    </div>

    <!-- COLUNA 2 -->

    <div
    class="coluna colunaCentro">

        <div
        class="painel"
        id="painelCentro">

        </div>

    </div>

    <!-- COLUNA 3 -->

    <div
    class="colunaPrincipal">

        <div
        class="painelPrincipal">

            <div
            class="tituloStatus">

                USANDO A PALAVRA:

            </div>

            <div class="areaOrador">
    <div id="oradorAtual">AGUARDANDO INÍCIO</div>
</div>

            <div id="cronometro">

                05:00

            </div>

            <div id="proximoOrador">

                Próximo(a) Orador(a): ---

            </div>

            <div id="mensagemTempo"></div>

            <div id="historicoInfo"></div>

            <div class="opcoes">

                <button id="btnAlarme" class="btn-notificacao" style="background:#ff6f00;">
                    🟠 Alarme ligado
                </button>

                <button id="btnTempoExtra" class="btn-notificacao" style="background:#ff6f00;">
                    🟠 Tempo extra ligado
                </button>

            </div>

            <div id="controlesPausa" style="display: none; margin-top: 15px; flex-direction: column; align-items: center; gap: 10px;">

                <div style="display: flex; gap: 10px; justify-content: center;">

                    <button class="btnControleFila btnIniciarFila" onclick="iniciarCronometro()" style="padding: 10px 22px; font-size: 15px; border-radius: 8px;">
                        ▶ Iniciar
                    </button>

                    <button class="btnControleFila btnPausarFila" onclick="pausarCronometro()" style="padding: 10px 22px; font-size: 15px; border-radius: 8px;">
                        ⏸ Pausar
                    </button>

                </div>

                <div>

                    <button class="btnControleFila" onclick="restaurarCronometro()" style="padding: 10px 22px; font-size: 15px; background: #00bcd4; color: white; border-radius: 8px;">
                        ↺ Reiniciar
                    </button>

                </div>

            </div>

            <div class="acoes" style="display: none;">

                <button id="btnIniciar">
                    ▶ Iniciar
                </button>

                <button id="btnPausar">
                    <img class="iconeBotao" src="icons/pausa.svg" alt="">
                    Pausar
                </button>

                <button id="btnEncerrar">
                    ■ Encerrar
                </button>

                <button id="btnProximo">
                    ⏭ Próximo
                </button>

                <button id="btnRetornar">
                    ⏮ Retornar
                </button>

                <button id="btnRestaurar">
                    ↺ Restaurar
                </button>

                <button id="btnTelao">
                    🖥 Telão
                </button>

            </div>

        </div>

    </div>

</div>

<script src="controle.js"></script>

</body>

</html>
